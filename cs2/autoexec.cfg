// ============================================================
//  CS2 autoexec — настройки "как у про-игроков"
//  Путь: Steam\steamapps\common\Counter-Strike Global Offensive\game\csgo\cfg\autoexec.cfg
//  Параметры запуска в Steam:  +exec autoexec
// ============================================================

// --- Прицел: статичный, НЕ прыгает при отдаче ---
cl_crosshair_recoil              false   // прицел не следует за отдачей (не "трясётся")
cl_crosshairstyle                4       // статичный классический
cl_crosshairgap_useweaponvalue   0       // не расширяется при стрельбе/движении
cl_crosshair_dynamic_splitdist   0
cl_crosshairsize                 2
cl_crosshairthickness            0.5
cl_crosshairgap                  -2
cl_crosshairdot                  0
cl_crosshair_t                   0
cl_crosshair_drawoutline         1
cl_crosshair_outlinethickness    1
cl_crosshaircolor                1       // зелёный

// --- Модель оружия: меньше закрывает обзор ---
viewmodel_presetpos              3       // классическая позиция
viewmodel_fov                    68
viewmodel_offset_x               2.5
viewmodel_offset_y               0
viewmodel_offset_z               -1.5

// --- Мышь (подставь свою чувствительность) ---
sensitivity                      1.2     // у про обычно 400 DPI x ~1.5-2.5 или 800 DPI x ~0.8-1.2
zoom_sensitivity_ratio           1.0
m_yaw                            0.022
m_pitch                          0.022

// --- Радар ---
cl_radar_always_centered         0
cl_radar_scale                   0.4
cl_hud_radar_scale               1.15
cl_radar_square_with_scoreboard  1

// --- Разное ---
cl_autowepswitch                 0       // не менять оружие при подборе
fps_max                          0
cl_showfps                       0

echo "== autoexec loaded =="
host_writeconfig
